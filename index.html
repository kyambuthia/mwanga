<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mwanga — WebGL2 Engine</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        color: #e6edf3;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        user-select: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        background: rgba(11, 14, 20, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.5;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="mwanga-canvas"></canvas>
      <div id="hud">Loading mwanga...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
